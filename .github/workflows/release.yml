name: Release

# Push a tag like v0.2.0 to build prebuilt binaries and publish a GitHub release.
# install.sh downloads these, so users don't need Rust.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux binaries are static (musl), so they run on any distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Built on Apple silicon for Intel Macs.
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=meng-${{ matrix.target }}.tar.gz
          tar -czf "$name" -C target/${{ matrix.target }}/release meng
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: meng-${{ matrix.target }}
          path: meng-${{ matrix.target }}.tar.gz*

  vscode:
    runs-on: ubuntu-latest
    env:
      # Publishing to the Marketplace needs a publisher token in the VSCE_PAT secret.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Package the extension
        run: sh editors/vscode/package.sh meng-lang.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: meng-lang-vsix
          path: meng-lang.vsix
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath meng-lang.vsix

  release:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
